[package]
name = "snippets"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
profiling = "1.0.18"
puffin = { version = "0.20.0", optional = true }
puffin_http = { version = "0.17.0", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }

[features]
profile-with-puffin = ["profiling/profile-with-puffin", "dep:puffin", "dep:puffin_http"]

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
